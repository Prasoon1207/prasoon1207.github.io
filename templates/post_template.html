<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script>
      (function() {{
        try {{
          var bg = sessionStorage.getItem('fpl_bg_color') || localStorage.getItem('fpl_bg_color');
          if (bg) {{
            document.documentElement.style.backgroundColor = bg;
            document.write('<style>html, body {{ background-color: ' + bg + ' !important; }}</style>');
          }}
        }} catch(e) {{}}
      }})();
    </script>
    <!-- MathJax for LaTeX rendering -->
    <script>
        window.MathJax = {{
            tex: {{
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            }},
            options: {{
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }}
        }};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>

<body>
    <table style="width:100%;max-width:800px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;"><tbody>
      <tr style="padding:0px">
        <td style="padding:0px">

          <!-- Post Content -->
          <table style="width:100%;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;"><tbody>
            <tr>
              <td style="padding:16px;width:100%;vertical-align:middle">
                <p style="margin:0 0 20px 0;"><a href="../index.html">&larr; Back to Home</a></p>
                <header>
                  <h1 style="font-size: 26px; font-weight: 700; margin-top: 0; margin-bottom: 6px; line-height: 1.25;">{title}</h1>
                  <p class="meta" style="margin-top: 0; margin-bottom: 16px;"><i>Published on {formatted_date} &bull; {reading_time} min read</i></p>
                </header>

                <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 16px 0 24px 0;">

                <main>
                  <article class="post-content">
{content}
                  </article>
                </main>

                <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 32px 0 16px 0;">

                <footer>
                  <p><a href="../index.html">&larr; Back to Home</a></p>
                  <p style="text-align:right;font-size:small;margin-top:24px;">
                    Website template adapted from <a href="https://github.com/jonbarron/jonbarron.github.io">Jon Barron</a>.
                    <br>
                    <span id="fpl-mood-note"></span>
                  </p>
                </footer>
              </td>
            </tr>
          </tbody></table>

        </td>
      </tr>
    </tbody></table>
    <script src="../fpl-mood.js"></script>
</body>

</html>
