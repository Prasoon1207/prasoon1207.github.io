name: Update FPL Mood

on:
  schedule:
    # Runs twice daily at 06:00 and 18:00 UTC
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-fpl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest FPL score
        run: python scripts/update_fpl.py

      - name: Commit and push if fpl.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet fpl.json; then
            git add fpl.json
            git commit -m "chore: update FPL mood data [skip ci]"
            git push
          else
            echo "No changes in FPL score."
          fi
